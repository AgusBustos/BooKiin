<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BooKiin - Gestión de Biblioteca</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- html5-qrcode for barcode scanning -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <!-- Phosphor Icons (for modern icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- App Header -->
    <header class="app-header">
        <div class="logo">
            <i class="ph ph-books"></i>
            <h1>BooKiin</h1>
        </div>
        <button id="theme-toggle" class="icon-btn" style="background:none; border:none; color:var(--text-main); font-size:1.5rem; cursor:pointer;">
            <i class="ph ph-moon" id="theme-icon"></i>
        </button>
    </header>

    <!-- Main Content Area -->
    <main id="main-content">
        <!-- View: Home -->
        <section id="view-home" class="view active">
            <div class="card-glass">
                <h2>Resumen</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <i class="ph ph-books"></i>
                        <span class="stat-value" id="stat-books">0</span>
                        <span class="stat-label">Libros</span>
                    </div>
                    <div class="stat-card">
                        <i class="ph ph-users"></i>
                        <span class="stat-value" id="stat-users">0</span>
                        <span class="stat-label">Socios</span>
                    </div>
                    <div class="stat-card">
                        <i class="ph ph-arrows-left-right"></i>
                        <span class="stat-value" id="stat-loans">0</span>
                        <span class="stat-label">Préstamos</span>
                    </div>
                </div>
            </div>
            
            <div class="card-glass mt-4">
                <h3>Acciones Rápidas</h3>
                <div class="actions-grid">
                    <button class="action-btn" onclick="navTo('scan')">
                        <i class="ph ph-barcode"></i>
                        <span>Escanear</span>
                    </button>
                    <button class="action-btn" onclick="openManualEntry()">
                        <i class="ph ph-keyboard"></i>
                        <span>Manual</span>
                    </button>
                    <button class="action-btn" onclick="navTo('loans')" style="grid-column: span 2;">
                        <i class="ph ph-handshake"></i>
                        <span>Préstamo</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- View: Scan / Register Book -->
        <section id="view-scan" class="view">
            <div class="card-glass">
                <h2>Escanear Libro</h2>
                <p>Escanea el ISBN para registrar el libro.</p>
                <div id="reader" width="100%"></div>
                <div id="scan-result" class="hidden mt-4">
                    <h3>Información del Libro</h3>
                    <form id="book-form">
                        <div class="form-group">
                            <label for="book-isbn">ISBN</label>
                            <input type="text" id="book-isbn" readonly>
                        </div>
                        <div class="form-group">
                            <label for="book-title">Título</label>
                            <input type="text" id="book-title" required>
                        </div>
                        <div class="form-group">
                            <label for="book-author">Autor</label>
                            <input type="text" id="book-author">
                        </div>
                        <div class="form-group">
                            <label for="book-publisher">Editorial</label>
                            <input type="text" id="book-publisher">
                        </div>
                        <div class="form-group">
                            <label for="book-category">Categoría (Materia)</label>
                            <input type="text" id="book-category">
                        </div>
                        <div class="form-group">
                            <label for="book-shelf">Estantería / Almacén</label>
                            <input type="text" id="book-shelf" placeholder="Ej: Pasillo A, Estante 3">
                        </div>
                        <div class="form-group">
                            <label for="book-url">URL Portada</label>
                            <input type="text" id="book-url">
                        </div>
                        <button type="submit" id="btn-register-book" class="primary-btn mt-2">Guardar Libro</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- View: Loans -->
        <section id="view-loans" class="view">
            <div class="card-glass">
                <h2>Préstamos</h2>
                <form id="loan-form">
                    <div class="form-group">
                        <label for="loan-dni">DNI del Socio</label>
                        <input type="text" id="loan-dni" placeholder="Ej: 12345678" required>
                    </div>
                    <div class="form-group">
                        <label for="loan-ejemplar">ID del Ejemplar</label>
                        <input type="number" id="loan-ejemplar" placeholder="Ej: 1" required>
                    </div>
                    <button type="submit" class="primary-btn">Registrar Préstamo</button>
                </form>
                <div id="loan-msg" class="msg hidden"></div>
            </div>
        </section>

        <!-- View: Settings (Optional) -->
        <section id="view-settings" class="view">
            <div class="card-glass">
                <h2>Ajustes</h2>
                <p>Configuraciones del sistema y API.</p>
                <div class="form-group mt-4">
                    <label for="api-url">URL del Backend (API)</label>
                    <input type="text" id="api-url" value="">
                </div>
            </div>
        </section>

        <!-- View: Inventory -->
        <section id="view-inventory" class="view">
            <div class="card-glass">
                <h2>Inventario de Libros</h2>
                <p>Modifica los detalles de los libros registrados.</p>
                <div id="inventory-list" class="mt-4" style="display:flex; flex-direction:column; gap:1rem;">
                    <!-- Los libros se cargarán aquí dinámicamente -->
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav glass-nav">
        <button class="nav-item active" data-target="home" onclick="navTo('home')">
            <i class="ph ph-house"></i>
            <span>Inicio</span>
        </button>
        <button class="nav-item" data-target="scan" onclick="navTo('scan')">
            <i class="ph ph-barcode"></i>
            <span>Escanear</span>
        </button>
        <button class="nav-item" data-target="inventory" onclick="navTo('inventory')">
            <i class="ph ph-books"></i>
            <span>Inv.</span>
        </button>
        <button class="nav-item" data-target="loans" onclick="navTo('loans')">
            <i class="ph ph-arrows-left-right"></i>
            <span>Préstamos</span>
        </button>
        <button class="nav-item" data-target="settings" onclick="navTo('settings')">
            <i class="ph ph-gear"></i>
            <span>Ajustes</span>
        </button>
    </nav>

    <!-- Overlay Loader -->
    <div id="loader" class="loader-overlay hidden">
        <div class="spinner"></div>
    </div>

    <script src="app.js"></script>
    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
