version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bookiin_postgres
    restart: always
    environment:
      POSTGRES_DB: bookiin_db
      POSTGRES_USER: bookiin_user
      POSTGRES_PASSWORD: bookiin_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: bookiin_backend
    restart: always
    environment:
      - DB_HOST=postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
